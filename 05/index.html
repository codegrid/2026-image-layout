<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>object-fit: scale-downで小さい画像を引き伸ばさない</title>
<link rel="stylesheet" href="../common.css">
<style>
.item img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: contain;
  background-color: #ddd;
}
[data-mode="scale-down"] .item img {
  object-fit: scale-down;
}
</style>
</head>
<body data-mode="contain">
<form class="controls">
  <label><input type="radio" name="mode" value="contain" checked> contain</label>
  <label><input type="radio" name="mode" value="scale-down"> scale-down</label>
</form>
<ul class="items">
  <li class="item"><img src="../img/small.png" width="120" height="90" alt="青いカメラのアイコン"><p>アイコン（120×90）</p></li>
  <li class="item"><img src="../img/mug.jpg" width="600" height="600" alt="黄色いマグカップ"><p>マグカップ（600×600）</p></li>
</ul>
<script>
document.querySelector(".controls").addEventListener("change", (event) => {
  document.body.dataset.mode = event.target.value;
});
</script>
</body>
</html>
