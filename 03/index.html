<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>object-fit: coverで枠を埋める</title>
<link rel="stylesheet" href="../common.css">
<style>
.item img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  object-fit: cover;
}
</style>
</head>
<body>
<ul class="items">
  <li class="item"><img src="../img/bottle.jpg" width="400" height="900" alt="緑色のボトル"><p>ボトル（縦長）</p></li>
  <li class="item"><img src="../img/sneaker.jpg" width="1000" height="500" alt="赤いスニーカー"><p>スニーカー（横長）</p></li>
  <li class="item"><img src="../img/mug.jpg" width="600" height="600" alt="黄色いマグカップ"><p>マグカップ（正方形）</p></li>
  <li class="item"><img src="../img/lighthouse.jpg" width="1200" height="800" alt="海辺の灯台"><p>灯台（横長）</p></li>
</ul>
</body>
</html>
