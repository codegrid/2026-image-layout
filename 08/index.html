<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>maskで写真の端をなじませる</title>
<link rel="stylesheet" href="../common.css">
<style>
.items {
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}
.frame {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1;
  border: 1px solid #ccc;
}
.frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
.frame-main {
  object-fit: contain;
}
.frame-backdrop {
  object-fit: cover;
  filter: blur(16px);
  scale: 1.1;
}
.frame-backdrop {
  filter: blur(16px) brightness(0.85) saturate(0.9);
}
[data-mode="mask"] .frame-main {
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 100%;
  margin: auto;
  mask-image: linear-gradient(var(--fade), transparent, #000 10%, #000 90%, transparent);
}
</style>
</head>
<body data-mode="none">
<form class="controls">
  <label><input type="radio" name="mode" value="none" checked> maskを指定しない</label>
  <label><input type="radio" name="mode" value="mask"> maskで端をなじませる</label>
</form>
<ul class="items">
  <li class="item">
    <div class="frame">
      <img class="frame-backdrop" src="../img/balloon.jpg" alt="">
      <img class="frame-main" src="../img/balloon.jpg" width="600" height="900" alt="空に浮かぶ気球" style="--fade: to right">
    </div>
    <p>気球（<code>--fade: to right</code>）</p>
  </li>
  <li class="item">
    <div class="frame">
      <img class="frame-backdrop" src="../img/lighthouse.jpg" alt="">
      <img class="frame-main" src="../img/lighthouse.jpg" width="1200" height="800" alt="海辺の灯台" style="--fade: to bottom">
    </div>
    <p>灯台（<code>--fade: to bottom</code>）</p>
  </li>
</ul>
<script>
document.querySelector(".controls").addEventListener("change", (event) => {
  document.body.dataset.mode = event.target.value;
});
</script>
</body>
</html>
